[project]
name = "ppe-detection"
version = "0.1.0"
description = "UTS group assignment: PPE detection on the Construction Site Safety dataset (YOLO26 vs Faster R-CNN)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # YOLO26 weights first shipped in ultralytics 8.4.0.
    "ultralytics>=8.4.0",
    # PyTorch stopped publishing Intel-Mac wheels after 2.2.2, which also needs numpy 1.x.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision>=0.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "clearml>=2.1.12",
    "pycocotools>=2.0.11",
    "torchmetrics>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppe", "src/ppe_detection_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
