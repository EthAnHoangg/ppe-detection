# Settings that must match across both models for a fair comparison.
# Values marked "team decision" are the [bracketed] items in report Section 4; change them here, commit, then cite this file.
project: PPE-Detection
dataset:
  id: a62e244036c5470ea39cd445a60f6594  # from scripts/register_dataset.py (v1, 5,604 files, 2026-10-16)
  version: v1
imgsz: 640        # the images are already 640x640
seeds: [0, 1, 2]  # team decision
epochs: 100       # team decision: maximum epochs
patience: 20      # team decision: early stop after this many epochs without val mAP50-95 gain
smoke:
  images: 16      # train/val images per split for --smoke runs
eval:
  latency_warmup: 20        # untimed batch-1 calls before timing
  latency_images: 200       # timed calls, cycling through the split (report Section 4.1 [200])
  smoke_latency_images: 5   # timed calls on --smoke runs (warm-up is 1)
